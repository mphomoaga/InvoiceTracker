<main class="auth-page">
  <section class="auth-card">
    <div class="brand brand-dark">
      <span class="brand-mark">▤</span>
      <span>InvoiceTracker</span>
    </div>
    
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Email address</label>
      <input id="email" type="email" formControlName="email" placeholder="you@company.com" autocomplete="email">
      <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</small>

      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Enter your password" autocomplete="current-password">
      <small class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">Password must be at least 6 characters.</small>

      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button class="btn btn-primary btn-full" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
