<main class="login-page">
  <section class="login-card">
    <div class="login-brand"><span class="brand-mark">▤</span><strong>InvoiceTracker</strong></div>
    <div class="login-heading"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your workspace</h1><p>Manage invoices and keep your cash flow clear.</p></div>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Email address</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com">
      <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</small>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="Enter your password">
      <small class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">Password is required.</small>
      <div class="alert error" *ngIf="error">{{ error }}</div>
      <button class="btn btn-primary login-button" type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button>
    </form>

  </section>
</main>
